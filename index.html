<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UX Designer Portfolio | Matrix Style</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            color: #ffffff;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            height: 100vh;
            position: relative;
        }

        #matrix {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 2rem;
        }

        .main-title {
            font-size: 5rem;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 3rem;
            text-shadow: 0 0 20px rgba(153, 153, 153, 0.7);
            letter-spacing: 2px;
            position: relative;
        }

        .cursor {
            display: inline-block;
            width: 3px;
            height: 5rem;
            background-color: #999999;
            margin-left: 5px;
            animation: blink 1s infinite;
            vertical-align: middle;
        }

        .start-btn {
            background: transparent;
            border: 2px solid #ffffff;
            color: #ffffff;
            padding: 1.5rem 4rem;
            font-size: 1.5rem;
            font-weight: bold;
            letter-spacing: 3px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            position: fixed;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            overflow: hidden;
            z-index: 1000; /* Always on top and clickable */
        }

        .start-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 30px rgba(153, 153, 153, 0.5);
            border-color: #999999;
            color: #999999;
            transform: translateY(-5px);
        }

        .start-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(153, 153, 153, 0.2), transparent);
            transition: left 0.5s;
        }

        .start-btn:hover::before {
            left: 100%;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        @keyframes chromatic-aberration {
            0% {
                text-shadow: 
                    -1px -1px 0 rgba(255, 0, 0, 0.5),
                    1px 1px 0 rgba(0, 255, 255, 0.5);
            }
            50% {
                text-shadow: 
                    1px -1px 0 rgba(0, 255, 0, 0.5),
                    -1px 1px 0 rgba(255, 0, 255, 0.5);
            }
            100% {
                text-shadow: 
                    -1px -1px 0 rgba(255, 0, 0, 0.5),
                    1px 1px 0 rgba(0, 255, 255, 0.5);
            }
        }

        .glitch-text {
            animation: chromatic-aberration 3s infinite;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .main-title {
                font-size: 3rem;
            }
            
            .cursor {
                height: 3rem;
            }
            
            .start-btn {
                padding: 1rem 2.5rem;
                font-size: 1.2rem;
                bottom: 30px;
            }
        }
        
        @media (max-width: 480px) {
            .main-title {
                font-size: 2.2rem;
            }
            
            .start-btn {
                padding: 0.8rem 2rem;
                font-size: 1rem;
                bottom: 20px;
            }
        }
    </style>
</head>
<body>
    <canvas id="matrix"></canvas>
    
    <div class="content">
        <h1 class="main-title glitch-text" id="typing-text">
            <span id="typed-text"></span><span class="cursor"></span>
        </h1>
        
        <button class="start-btn" id="startBtn">
            START
        </button>
    </div>

    <script>
        // Matrix Rain Effect
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        
        // Set canvas to full window size
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        // Matrix characters - mix of Latin, Japanese, and symbols
        const chars = "01アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲンABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789$+-*/=%\"'#&_(),.;:?!\\|{}<>[]^~";
        const charArray = chars.split("");
        
        const fontSize = 14;
        const columns = canvas.width / fontSize;
        
        // Create array for drops
        const drops = [];
        for (let i = 0; i < columns; i++) {
            drops[i] = Math.floor(Math.random() * canvas.height / fontSize) * fontSize;
        }
        
        // Color settings - darker gray matrix effect
        let matrixColor = '#999999';
        let speed = 0.5; // Slowed down by 4x total (was 2 → 1 → 0.5)
        let density = 1;

        function drawMatrix() {
            // Semi-transparent black rectangle for trail effect
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = matrixColor;
            ctx.font = `${fontSize}px 'Courier New', monospace`;
            
            for (let i = 0; i < drops.length * density; i++) {
                if (i % density === 0) {
                    const text = charArray[Math.floor(Math.random() * charArray.length)];
                    
                    // Random brightness for some characters
                    const brightness = Math.random() > 0.7 ? 1 : Math.random() * 0.5 + 0.3;
                    ctx.fillStyle = matrixColor.replace(')', `, ${brightness})`).replace('rgb', 'rgba');
                    
                    // Draw character
                    ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                    
                    // Move drop down
                    drops[i] += speed;
                    
                    // Reset drop if it goes beyond canvas
                    if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                        drops[i] = 0;
                    }
                }
            }
        }
        
        // Animation control
        let matrixAnimationId = null;
        let isMatrixAnimating = true;
        
        // Animation loop
        function animate() {
            if (!isMatrixAnimating) return;
            
            drawMatrix();
            matrixAnimationId = requestAnimationFrame(animate);
        }
        
        function stopMatrixAnimation() {
            isMatrixAnimating = false;
            if (matrixAnimationId) {
                cancelAnimationFrame(matrixAnimationId);
                matrixAnimationId = null;
            }
        }
        
        function startMatrixAnimation() {
            isMatrixAnimating = true;
            animate();
        }
        
        // Handle window resize
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            // Reset drops array
            const newColumns = canvas.width / fontSize;
            drops.length = 0;
            for (let i = 0; i < newColumns; i++) {
                drops[i] = Math.floor(Math.random() * canvas.height / fontSize) * fontSize;
            }
        });
        
        // Self-typing text effect
        const typingText = document.getElementById('typed-text');
        const texts = [
            'Hello World',
            'My name is Vladimir',
            "I'm a UX designer"
        ];
        let textIndex = 0;
        let charIndex = 0;
        let isDeleting = false;
        let typingSpeed = 200; // ms per character
        
        function typeText() {
            const currentText = texts[textIndex];
            
            if (!isDeleting && charIndex <= currentText.length) {
                // Typing forward
                typingText.textContent = currentText.substring(0, charIndex);
                charIndex++;
                setTimeout(typeText, typingSpeed);
            } else if (isDeleting && charIndex >= 0) {
                // Deleting backward
                typingText.textContent = currentText.substring(0, charIndex);
                charIndex--;
                setTimeout(typeText, typingSpeed / 2);
            } else {
                // Switch between typing and deleting
                isDeleting = !isDeleting;
                
                if (!isDeleting) {
                    // Move to next text
                    textIndex = (textIndex + 1) % texts.length;
                }
                
                // Pause before next action
                setTimeout(typeText, isDeleting ? 1000 : 500);
            }
        }
        
        // Hyperspace effect
        let hyperspaceEffect = null;
        let isHyperspaceActive = false;
        
        // Start button functionality
        document.getElementById('startBtn').addEventListener('click', () => {
            const btn = document.getElementById('startBtn');
            
            if (isHyperspaceActive) {
                // Stop hyperspace effect
                if (hyperspaceEffect) {
                    hyperspaceEffect.stop();
                    hyperspaceEffect = null;
                }
                isHyperspaceActive = false;
                btn.textContent = 'START';
                
                // Restart matrix rain
                startMatrixAnimation();
            } else {
                // Start hyperspace effect
                isHyperspaceActive = true;
                btn.textContent = 'RETURN';
                btn.disabled = true;
                
                // Add glitch effect
                const title = document.querySelector('.main-title');
                title.style.animation = 'none';
                
                setTimeout(() => {
                    title.style.animation = 'chromatic-aberration 0.5s';
                }, 10);
                
                setTimeout(() => {
                    title.style.animation = 'chromatic-aberration 3s infinite';
                    
                    // Stop matrix rain animation
                    stopMatrixAnimation();
                    
                    // Create and start hyperspace effect
                    hyperspaceEffect = new HyperspaceEffect(canvas, ctx);
                    hyperspaceEffect.start();
                    
                    // Re-enable button
                    btn.disabled = false;
                }, 500);
            }
        });
        
        // Initialize
        animate();
        typeText(); // Start typing effect
    </script>
    
    <script src="hyperspace-effect.js"></script>
</body>
</html>
